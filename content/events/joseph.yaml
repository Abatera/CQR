tradition:
  - kind: ahl-al-kitab
    attribution:
      en: The People of the Book and Ibn Jarir; al-Hasan al-Basri. Reported by Ibn Kathir
      ar: أهل الكتاب وابن جرير؛ والحسن البصري. نقله ابن كثير
    text:
      en: Joseph died aged 110, according to the People of the Book and Ibn Jarir; al-Hasan al-Basri said 120. He was embalmed and kept in Egypt until Moses took him out to be buried with his forefathers.
      ar: "توفّي يوسف ابنَ مئةٍ وعشر سنين، على قول أهل الكتاب وابن جرير، وقال الحسن البصري: مئةٍ وعشرين. وحُنِّط وبقي في مصر حتى أخرجه موسى ليُدفن مع آبائه."
    original: فمات وهو ابن مائة سنة وعشر سنين
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «ما وقع من الأمور العجيبة في حياة إسرائيل»
