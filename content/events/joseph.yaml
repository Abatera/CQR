title:
  en: Yusuf (Joseph)
  ar: يوسف
summary:
  en: Yusuf (Joseph), peace be upon him, sold into Egypt by his brothers, who rose to govern its stores and brought his family there. His story fills a whole surah (12).
when:
  from: -1750
  to: -1641
  certainty: traditional
  basis:
    en: Placed a generation after Jacob, with the 110-year life given by the People of the Book and Ibn Jarir (Genesis 50:26). Al-Hasan al-Basri gives 120 years. Both are reported by Ibn Kathir.
