id: idris
kind: period
lane: prophets
review: draft
title:
  en: Idris (Enoch)
  ar: إدريس
summary:
  en: Idris, peace be upon him, whom the Quran calls truthful, a prophet raised to a high station (19:56-57). Muslim scholars commonly identify him with Enoch (Akhnukh) of the biblical genealogy.
when:
  from: -4783
  to: -4419
  certainty: reckoned
  basis:
    en: Ibn Ishaq says he lived through 308 years of Adam's life, so his span starts 308 years before Adam's death (about 4476 BCE, see Adam). No Islamic report gives his age; the span uses the 365 years the Torah gives Enoch, with whom Ibn Kathir identifies Idris. In that count he is taken 69 years before Noah's birth, so the three do not collide.
place:
  status: unknown
  description:
    en: The Quran names no place.
quran: [ "19:56-57", "21:85" ]
tradition:
  - kind: historian
    attribution:
      en: Ibn Kathir, citing Ibn Ishaq
    text:
      en: He was the first of Adam's descendants to be given prophethood, after Adam and Seth, and he lived through 308 years of Adam's life. Ibn Kathir identifies him with Enoch (Khanukh) in Noah's genealogy.
      ar: وكان أول بني آدم أعطي النبوة، بعد آدم وشيث
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «إدريس عليه السلام»
  - kind: ahl-al-kitab
    attribution:
      en: The Torah (Genesis 5)
    text:
      en: All Enoch's days were 365 years. Enoch walked with God, and he was not found, for God took him.
    source:
      id: bible-web
      locator: Genesis 5:23-24
related:
  - { id: adam, type: context }
  - { id: noah, type: context }
tags: [ prophets, idris, chronology ]
