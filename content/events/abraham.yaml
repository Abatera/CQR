tradition:
  - kind: hadith
    attribution:
      en: The Prophet ﷺ, narrated by Abu Umama al-Bahili
      ar: النبي ﷺ، من رواية أبي أمامة الباهلي
    text:
      en: Between Noah and Abraham were ten qurun. The full report and its gradings are under Adam.
      ar: يذكر الحديث أن بين نوح وإبراهيم عشرة قرون. والرواية كاملةً بدرجاتها في مدخل آدم.
    source:
      id: hakim-mustadrak
      locator: 2/288
    gradings:
      - grade: sahih
        by:
          en: al-Hakim
          ar: الحاكم
        source:
          id: hakim-mustadrak
          locator: 2/288
        note:
          en: Sound on the condition of Muslim, though some of its narrators were criticized.
          ar: صحيحٌ على شرط مسلم، وإن تُكلِّم في بعض رواته.
      - grade: sahih
        by:
          en: al-Albani
          ar: الألباني
        source: albani-sahiha
        note:
          en: Authenticated with its supporting narrations.
          ar: صحّحه بشواهده.
  - kind: historian
    attribution:
      en: Ibn Kathir
      ar: ابن كثير
    text:
      en: More than a thousand years separate Abraham, who built the Sacred House, from Solomon, who built Bayt al-Maqdis. The same chapter cites the hadith of Abu Dharr, which puts forty years between the founding of the two mosques.
      ar: بين إبراهيم، باني البيت الحرام، وسليمان، باني بيت المقدس، أكثرُ من ألف سنة. ويذكر الفصلُ نفسه حديثَ أبي ذر الذي يجعل بين تأسيس المسجدين أربعين سنة.
    source:
      id: ibn-kathir-bidaya
      locator: vol. 2, «قصة سليمان بن داود عليهما السلام»
  - kind: historian
    attribution:
      en: Ibn Kathir, citing Ibn Jarir's history
      ar: ابن كثير، نقلًا عن تاريخ ابن جرير
    text:
      en: Abraham was born in the time of Nimrod son of Kan'an, who, it is said, is al-Dahhak, the famous king said to have ruled a thousand years.
      ar: وُلد إبراهيم في زمن النمرود بن كنعان، الذي قيل إنه الضحاك، الملك المشهور الذي يقال إنه ملك ألف سنة.
    original: "ذكر ابن جرير في تاريخه، أن مولده كان في زمن النمرود بن كنعان … وهو فيما قيل الضحاك الملك المشهور، الذي يقال: إنه ملك ألف سنة"
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
  - kind: historian
    attribution:
      en: Ibn Kathir, citing Ibn 'Asakir
      ar: ابن كثير، نقلًا عن ابن عساكر
    text:
      en: The correct view is that Abraham was born in Babylon. He was buried at Hebron; this is known by continuous tradition, but no sound report from the infallible Prophet fixes the exact spot.
      ar: الصحيح أن إبراهيم وُلد ببابل. ودُفن في حبرون، وهذا معروفٌ بالتواتر، لكن لم تُعيِّن روايةٌ صحيحة عن النبي المعصوم الموضعَ بعينه.
    original: والصحيح أنه ولد ببابل
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «قصة إبراهيم خليل الرحمن»; «وفاة إبراهيم وما قيل في عمره»
  - kind: historian
    attribution:
      en: Ibn Kathir
      ar: ابن كثير
    text:
      en: It is said he was born at al-Sus; it is also said in Babylon, and in the Sawad near Kutha.
      ar: "قيل: وُلد بالسوس، وقيل: ببابل، وقيل: بالسواد من ناحية كوثى."
    original: "وكان مولده بالسوس، وقيل: ببابل. وقيل: بالسواد من ناحية كوثى"
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
  - kind: ahl-al-kitab
    attribution:
      en: The People of the Book, as reported by Ibn Kathir
      ar: أهل الكتاب، فيما نقله ابن كثير
    text:
      en: Abraham died aged 175, or it is said 195. Ibn al-Kalbi gave 200 years.
      ar: "مات إبراهيم ابنَ مئةٍ وخمسٍ وسبعين سنة، وقيل: مئةٍ وخمسٍ وتسعين. وجعله ابن الكلبي مئتي سنة."
    original: "مات عن مائة وخمس وسبعين، وقيل: وتسعين سنة"
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
  - kind: ahl-al-kitab
    attribution:
      en: The Torah (Genesis 11–12)
      ar: التوراة (التكوين 11–12)
    text:
      en: Terah was 70 when Abram was born. Abram's brother Haran died in Ur of the Chaldees; the family left Ur for Canaan but settled in Haran, where Terah died at 205. Abram left Haran at 75.
      ar: كان تارح ابنَ سبعين سنة حين وُلد أبرام. ومات أخوه هاران في أور الكلدانيين؛ وخرجت الأسرة من أور قاصدةً كنعان، فأقامت في حاران، وفيها مات تارح ابنَ مئتين وخمس سنين. وخرج أبرام من حاران ابنَ خمسٍ وسبعين.
    source:
      id: bible-web
      locator: Genesis 11:26-32; 12:4
  - kind: ahl-al-kitab
    attribution:
      en: The rabbis (the Talmud, Bava Batra 91a), as the Jewish Encyclopedia reports
      ar: الأحبار (التلمود، بابا بترا 91أ)، كما تنقل الموسوعة اليهودية
    text:
      en: Abraham was born in Kutha, which they take to be another name for Ur of the Chaldees.
      ar: وُلد إبراهيم في كوثى، وهي عندهم اسمٌ آخر لأور الكلدانيين.
    source: je-abraham
history:
  - claim:
      en: Among the places in the Negev that Pharaoh Sheshonq I (the biblical Shishak) listed at Karnak in the later 10th century BCE, two signs have been read "Fort of Abram", with a question mark. If the reading is right, a place there bore the name of an Abram; it does not date the patriarch.
      ar: من بين الأماكن في النقب التي سجّلها الفرعون شيشنق الأول (شيشق في الكتاب المقدس) في الكرنك في أواخر القرن العاشر قبل الميلاد، قُرئت علامتان «حصن أبرام»، مع علامة استفهام. فإن صحّت القراءة، فقد كان هناك موضعٌ يحمل اسم أبرام؛ ولا يؤرّخ ذلك إبراهيم نفسه.
    status: debated
    sources: [ kitchen-shishak ]
  - claim:
      en: Radiocarbon dating at copper-smelting sites in the Aravah valley places the arrival of domestic camels in the southern Levant in the last third of the 10th century BCE or later.
      ar: يضع التأريخُ بالكربون المشع في مواقع صهر النحاس بوادي عربة وصولَ الجمال المستأنسة إلى جنوب بلاد الشام في الثلث الأخير من القرن العاشر قبل الميلاد أو بعده.
    status: established
    sources: [ aftau-camels-2014 ]
  - claim:
      en: The stories of Abraham in Genesis mention camels; the researchers take this as a sign that the Genesis text was written down long after the events it tells.
      ar: تذكر قصصُ إبراهيم في سفر التكوين الجمال؛ ويرى الباحثون في ذلك علامةً على أن نصّ التكوين دُوِّن بعد الأحداث التي يرويها بزمنٍ طويل.
    status: debated
    sources: [ aftau-camels-2014 ]
  - claim:
      en: Nicolaus of Damascus (1st century BCE), as Josephus quotes him, writes that Abram reigned at Damascus, a foreigner who came with an army from the land of the Chaldeans above Babylon, and that a village there was still named after him, "the Habitation of Abram".
      ar: يكتب نيقولاوس الدمشقي (القرن الأول قبل الميلاد)، فيما ينقله عنه يوسيفوس، أن أبرام ملك في دمشق، غريبًا جاء بجيشٍ من أرض الكلدانيين فوق بابل، وأن قريةً هناك كانت ما تزال تُسمّى باسمه، «مسكن أبرام» (العبارة مترجمةٌ عن الإنجليزية).
    status: established
    sources:
      - { id: josephus-antiquities, locator: 1.7.2 }
  - claim:
      en: Pompeius Trogus (1st century BCE), in Justin's epitome, lists Abraham among the early kings of Damascus, after Damascus, Azel and Ador, and before Israhel.
      ar: يعدّ بومبيوس تروغوس (القرن الأول قبل الميلاد)، في مختصر يوستينوس، إبراهيمَ بين ملوك دمشق الأوائل، بعد دمشق وأزيل وأدور، وقبل إسرائيل.
    status: established
    sources:
      - { id: justin-epitome, locator: "36.2" }
  - claim:
      en: Josephus quotes the Babylonian priest Berosus (3rd century BCE) on "a man righteous and great, and skilful in the celestial science" among the Chaldeans in the tenth generation after the Flood, and takes him to be Abram; Berosus names no one. The Jewish Encyclopedia notes that Alexandrian Jews wrote under the names of Hecataeus and Berosus, so the quotation may not be genuine.
      ar: ينقل يوسيفوس عن الكاهن البابلي بيروسوس (القرن الثالث قبل الميلاد) ذكرَ «رجلٍ صالحٍ عظيم، ماهرٍ في علم السماء» بين الكلدانيين في الجيل العاشر بعد الطوفان، ويرى أنه أبرام؛ ولا يسمّي بيروسوس أحدًا (العبارة مترجمةٌ عن الإنجليزية). وتلاحظ الموسوعة اليهودية أن يهود الإسكندرية كتبوا بأسماء هيكاتايوس وبيروسوس، فقد لا يكون النقل صحيح النسبة.
    status: debated
    sources:
      - { id: josephus-antiquities, locator: 1.7.2 }
      - je-abraham
connection:
  text:
    en: "In this reckoning Abraham lived from about 2166 to 1991 BCE. His life spans the Third Dynasty of Ur (about 2100–2000 BCE) and its end, when its king was carried off to Elam; Genesis names Ur of the Chaldees as his family's city and an Elamite king among the eastern kings of his time (Genesis 14:1). This places the stories beside a real moment of Mesopotamian history. It does not show that they happened then: the date itself rests on the People of the Book's numbers."
    ar: "في هذا الحساب عاش إبراهيم من نحو 2166 إلى 1991 ق.م. فتمتدّ حياته على عهد سلالة أور الثالثة (نحو 2100–2000 ق.م) ونهايتها، حين حُمل ملكها إلى عيلام؛ وتسمّي التوراة أورَ الكلدانيين مدينةً لأسرته، وتذكر ملكًا عيلاميًّا بين ملوك المشرق في زمنه (التكوين 14:1). وهذا يضع القصص إلى جانب لحظةٍ حقيقية من تاريخ بلاد الرافدين، لكنه لا يُثبت أنها وقعت حينها: فالتاريخ نفسه قائمٌ على أرقام أهل الكتاب."
