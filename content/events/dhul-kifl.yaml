id: dhul-kifl
kind: period
lane: prophets
review: draft
title:
  en: Dhu al-Kifl
  ar: ذو الكفل
summary:
  en: Dhu al-Kifl, peace be upon him, named among the patient and the best (21:85-86; 38:48). Who he was and when he lived are not known.
when:
  from: -1558
  to: -1450
  certainty: unknown
  basis:
    en: Unknown. He is placed after Job only because many identify him with Job's son Bishr, a claim Ibn Kathir reports without endorsing it ("God knows best"). The span means nothing more.
place:
  status: unknown
  description:
    en: Not known.
quran: [ "21:85-86", "38:48" ]
tradition:
  - kind: historian
    attribution:
      en: Ibn Kathir, citing Mujahid, Abu Musa al-Ash'ari and Ibn Jarir
    text:
      en: The apparent sense of the Quran is that he was a prophet, and this is the well-known view. Mujahid said he was a righteous man who took on the judging of his people; Abu Musa al-Ash'ari said he was not a prophet but a righteous man; Ibn Jarir suspended judgement.
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «قصة ذي الكفل الذي زعم قوم أنه ابن أيوب»
related:
  - { id: job, type: context }
tags: [ prophets, dhul-kifl ]
