notes: "The generational alternative is the project's own reckoning (one generation to one qarn), proposed and not yet confirmed by the owner. TODO history layer: the Assyrian annals of Sargon II are said to name the Tamudi among Arab tribes settled in Samaria (8th century BCE), and the Ruwafa inscriptions, dated about 165-169 CE, to name a Thamud unit that built a temple for Marcus Aurelius and Lucius Verus. Both were seen only in secondary summaries: ORACC failed with a certificate error and the Ca' Foscari chapter could not be decoded. The monumental tombs at Hegra are Nabataean; the UNESCO and Britannica pages refused automated access. Verify the coordinates."
