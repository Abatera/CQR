review: draft
title:
  en: The Flood of Noah
  ar: طوفان نوح
summary:
  en: After Noah, peace be upon him, had called his people for a thousand years less fifty, the Flood took them (29:14). Water poured from the sky and burst from the earth (54:11-12); Noah, his family and the believers were carried in the Ark, which came to rest on al-Judi (11:44).
  ar: بعد أن دعا نوحٌ عليه السلام قومه تسعمئةٍ وخمسين سنة، أخذهم الطوفان (29:14). فانهمر الماء من السماء وتفجّر من الأرض (54:11-12)، وحُمل نوحٌ وأهله والمؤمنون في السفينة، التي استقرّت على الجودي (11:44).
when:
  from: -3516
  to: -3516
  certainty: reckoned
  basis:
    en: 350 years before Noah's death (Ibn Sa'd), which is placed ten qurun, read as a thousand years, before Abraham, about 3166 BCE (see Noah). The year marks that reckoning only; history cannot date the Flood of the Quran.
    ar: قبل موت نوح بثلاثمئةٍ وخمسين سنة (ابن سعد)، وموته موضوعٌ قبل إبراهيم بعشرة قرون، تُقرأ ألفَ سنة، أي نحو 3166 ق.م (انظر نوح). والسنة المرسومة تعيّن هذا الحساب وحده؛ ولا يستطيع التاريخ تأريخ طوفان القرآن.
