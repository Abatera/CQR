tags: [ prophets, abraham, egypt ]
notes: "The hadith's narrator and wording were read only as Ibn Kathir quotes them. Leads, not yet sourced: Egypt in this reckoning's years (the First Intermediate Period); the Beni Hasan painting of Asiatic visitors (about 1890 BCE)."
