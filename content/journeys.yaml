# Guided journeys: ordered steps through events, walked one at a time in the app. See docs/04-data-model.md.
- id: the-prophets
  title:
    en: The prophets in order
    ar: الأنبياء على ترتيبهم
  summary:
    en: The 25 prophets named in the Quran, from Adam to Muhammad ﷺ, in the order of their traditional dates. Before Abraham the years are a reckoning from intervals reported in tradition.
    ar: الأنبياء الخمسة والعشرون الذين سمّاهم القرآن، من آدم إلى محمد ﷺ، على ترتيب تواريخهم في التراث. وقبل إبراهيم تكون السنون حسابًا من فتراتٍ مرويّة في التراث.
  review: draft
  order: 1
  steps:
    - { event: adam }
    - { event: idris }
    - { event: noah }
    - { event: hud }
    - { event: salih }
    - { event: abraham }
    - { event: lot }
    - { event: ishmael }
    - { event: isaac }
    - { event: jacob }
    - { event: joseph }
    - { event: job }
    - { event: shuayb }
    - { event: dhul-kifl }
    - { event: aaron }
    - { event: moses }
    - { event: david }
    - { event: solomon }
