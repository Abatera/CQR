      basis:
        en: 340 years before Noah's death, by Ibn Ishaq's figure for his life after the Ark.
        ar: قبل موت نوح بثلاثمئةٍ وأربعين سنة، برقم ابن إسحاق لعمره بعد السفينة.
      sources:
        - { id: suhari-ansab, locator: p. 21 }
place:
  status: proposed
  description:
    en: The Quran names al-Judi as where the Ark came to rest (11:44) and does not say where Noah's people lived. The commentators place al-Judi in al-Jazira or near Mosul; the Torah names "Ararat's mountains". Both areas drawn are rough sketches.
    ar: يسمّي القرآن الجوديَّ موضعًا لاستقرار السفينة (11:44)، ولا يذكر أين كان يسكن قوم نوح. ويضع المفسّرون الجوديَّ في الجزيرة أو قرب الموصل؛ وتسمّي التوراة «جبال أراراط». والمنطقتان المرسومتان تخطيطان تقريبيان.
  opinions:
    - name:
        en: al-Judi, a mountain in al-Jazira (Mujahid) or near Mosul (al-Dahhak, al-Qurtubi)
        ar: الجودي، جبلٌ بالجزيرة (مجاهد) أو قرب الموصل (الضحّاك، والقرطبي)
