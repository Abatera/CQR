notes: "TODO: the grading of the hadith of Abu Dharr (the wording in Ibn Hibban's Sahih was read only in a Wikisource search snippet); al-Qurtubi's reason, in his commentary on al-A'raf, for rejecting that Idris was Noah's ancestor; Ibn Kathir's remark after the Ilyas report (وهذا لا يدل), to be read in context; Ibn Battuta's passage, read only as a snippet; Charles's dates for the parts of 1 Enoch. Read only as search snippets and not added: Abu Ma'shar (the Hermes before the Flood, \"whom the Hebrews claim is Enoch\"), al-Ya'qubi and Ibn Khaldun (Hermes is Idris, \"it is said\"), Majmu' al-Fatawa (Hermes is a generic title), al-Fatawa al-Kubra on \"the craft of Idris\" (\"speech without knowledge\"), al-Maraghi (Idris revered by the ancient Egyptians), Ibn Abi Usaybi'a."
