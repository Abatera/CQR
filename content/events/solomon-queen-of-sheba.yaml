title:
  en: Solomon and the Queen of Saba'
  ar: سليمان وملكة سبأ
summary:
  en: The hoopoe brings Solomon news of Saba' and of a woman who rules it. The queen comes to Solomon and submits with him to God.
when:
  from: -970
  to: -931
  certainty: traditional
  basis:
    en: Within Solomon's traditional dates. The Quran gives no date.
place:
  status: unknown
  description:
    en: The Quran names Saba' as the queen's land but names no place for Solomon's court.
quran: [ "27:20-44" ]
