title:
  en: Yusuf (Joseph)
  ar: يوسف
summary:
  en: Yusuf (Joseph), peace be upon him, sold into Egypt by his brothers, who rose to govern its stores and brought his family there. His story fills a whole surah (12).
  ar: يوسف عليه السلام، باعه إخوته فصار إلى مصر، ثم ارتقى حتى تولّى خزائنها وأتى بأهله إليها. وقصته تملأ سورةً كاملة (12).
when:
  from: -1916
  to: -1807
  certainty: traditional
  basis:
    en: Placed a generation after Jacob, with the 110-year life given by the People of the Book and Ibn Jarir (Genesis 50:26). Al-Hasan al-Basri gives 120 years. Both are reported by Ibn Kathir.
    ar: موضوعٌ بعد يعقوب بجيل، بعمرٍ قدره مئةٌ وعشر سنين كما عند أهل الكتاب وابن جرير (التكوين 50:26). ويجعله الحسن البصري مئةً وعشرين سنة. وكلا القولين عند ابن كثير.
place:
  status: known
  names:
    - { name: Misr, type: ancient, language: Arabic }
  description:
    en: The Quran names Egypt (Misr) as the setting of Joseph's later life (12:21, 12:99). The outline is a rough sketch of the Nile valley and delta.
    ar: يسمّي القرآن مصرَ موضعًا لحياة يوسف اللاحقة (12:21، 12:99). والحدود المرسومة تخطيطٌ تقريبي لوادي النيل ودلتاه.
