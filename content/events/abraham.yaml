title:
  en: Ibrahim (Abraham)
  ar: إبراهيم
summary:
  en: Ibrahim (Abraham), peace be upon him, the Friend of God, who rejected his people's idols, was saved from the fire, emigrated to the blessed land, and with Ishmael raised the foundations of the House in Mecca. His life is told here in episodes, each placed by his age.
  ar: إبراهيم عليه السلام، خليل الله، الذي أنكر أصنام قومه، ونُجّي من النار، وهاجر إلى الأرض المباركة، ورفع مع إسماعيل أسس البيت في مكة. وتُعرض حياته هنا في وقائع، كلٌّ منها موضوعٌ بحسب سنّه.
when:
  from: -2166
  to: -1991
  certainty: traditional
  basis:
    en: "No Islamic source gives Abraham a year. The span follows the ages the People of the Book give the patriarchs, which Ibn Kathir reports and which are neither affirmed nor denied, counted back from the Exodus at about 1446 BCE (see Moses): 430 years in Egypt (Exodus 12:40), Jacob 130 on arrival (Genesis 47:9), Isaac 60 at Jacob's birth (25:26), Abraham 100 at Isaac's (21:5), and a life of 175 years (25:7). This agrees with Ibn Kathir's remark that more than a thousand years separate Abraham, who built the Sacred House, from Solomon, who built Bayt al-Maqdis. History cannot date Abraham."
    ar: "لا يذكر أيُّ مصدرٍ إسلامي لإبراهيم سنة. والمدّة تتبع الأعمار التي يذكرها أهل الكتاب للآباء، وينقلها ابن كثير، وهي لا تُصدَّق ولا تُكذَّب، محسوبةً رجوعًا من الخروج نحو 1446 ق.م (انظر موسى): أربعمئةٍ وثلاثون سنة في مصر (الخروج 12:40)، ويعقوب ابن مئةٍ وثلاثين عند دخولها (التكوين 47:9)، وإسحاق ابن ستين عند مولد يعقوب (25:26)، وإبراهيم ابن مئة عند مولد إسحاق (21:5)، وعمرٌ قدره مئةٌ وخمسٌ وسبعون سنة (25:7). ويوافق هذا قولَ ابن كثير إن بين إبراهيم، باني البيت الحرام، وسليمان، باني بيت المقدس، أكثرَ من ألف سنة. ولا يستطيع التاريخ تأريخ إبراهيم."
  alternatives:
    - from: -2000
      to: -1826
      basis:
        en: Ibn Kathir's more than a thousand years before Solomon, taken at its lower bound, with the 175-year life. This was the app's dating until 26 November 2026.
        ar: قول ابن كثير إن بين إبراهيم وسليمان أكثر من ألف سنة، مأخوذًا عند حدّه الأدنى، مع عمرٍ قدره مئةٌ وخمسٌ وسبعون سنة. وكان هذا تأريخ التطبيق حتى 26 نوفمبر 2026.
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 2, «قصة سليمان بن داود عليهما السلام»
    - from: -2166
      to: -1966
      basis:
        en: A life of 200 years, as Ibn al-Kalbi gave (reported by Ibn Kathir), from the same birth year.
        ar: عمرٌ قدره مئتا سنة، كما ذكر ابن الكلبي (فيما نقله ابن كثير)، من سنة المولد نفسها.
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
    - from: -1951
      to: -1776
      basis:
        en: The Septuagint counts the 430 years of Exodus 12:40 in the land of Egypt and the land of Canaan together. Counted from Abraham's arrival in Canaan at 75 (Genesis 12:4), he is born about 1951 BCE.
        ar: تجعل الترجمة السبعينية الأربعمئة والثلاثين سنة (الخروج 12:40) في أرض مصر وأرض كنعان معًا. فإذا حُسبت من وصول إبراهيم إلى كنعان ابنَ خمسٍ وسبعين (التكوين 12:4)، كان مولده نحو 1951 ق.م.
      sources:
        - { id: bible-lxx-brenton, locator: Exodus 12:40 }
        - { id: bible-web, locator: Genesis 12:4 }
    - from: -2900
      to: -2726
      basis:
        en: Ibn Sa'd's chain of intervals, counted back from the Prophet's birth (about 570 CE). These intervals rest on weak chains (see Moses and Jesus).
        ar: سلسلة الفترات عند ابن سعد، محسوبةً رجوعًا من مولد النبي ﷺ (نحو 570 م). وهذه الفترات قائمةٌ على أسانيد ضعيفة (انظر موسى وعيسى).
      sources:
        - { id: ibn-asakir-dimashq, locator: 1/32 }
place:
  status: proposed
  description:
    en: The Quran names no birthplace. Ibn Kathir gives Babylon, the land of the Chaldeans, as the correct and best-known view; other reports name al-Sus, the Sawad near Kutha, and Barza near Damascus. Genesis names Ur of the Chaldees as his family's city. He lived in Harran and then in the land of Bayt al-Maqdis, and was buried at Hebron. The points are approximate.
    ar: لا يسمّي القرآن مولده. ويجعل ابن كثير بابلَ، أرضَ الكلدانيين، القولَ الصحيح المشهور؛ وتذكر رواياتٌ أخرى السوس، والسوادَ من ناحية كوثى، وبرزةَ قرب دمشق. وتسمّي التوراة أورَ الكلدانيين مدينةً لأسرته. وسكن حرّان ثم أرض بيت المقدس، ودُفن في حبرون. والنقاط تقريبية.
  opinions:
    - name:
        en: Babylon, his birthplace, "the correct view" (Ibn 'Asakir, cited by Ibn Kathir)
        ar: بابل، مولده، وهو «الصحيح» (ابن عساكر، فيما نقله ابن كثير)
      geometry:
        type: Point
        coordinates: [ 44.42, 32.54 ]
      sources:
        - { id: ibn-kathir-bidaya, locator: "vol. 1, «قصة إبراهيم خليل الرحمن»" }
    - name:
        en: Kutha, in the Sawad (a report in Ibn Kathir; the Talmud also names Kutha, as the Jewish Encyclopedia reports)
        ar: كوثى، في السواد (روايةٌ عند ابن كثير؛ ويسمّي التلمود كوثى أيضًا، كما تنقل الموسوعة اليهودية)
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
        - je-abraham
    - name:
        en: Barza, in the Ghouta of Damascus (Ibn 'Asakir, from Ibn Abbas, cited by Ibn Kathir; Ibn 'Asakir himself prefers Babylon)
        ar: برزة، في غوطة دمشق (ابن عساكر، عن ابن عباس، فيما نقله ابن كثير؛ ويرجّح ابن عساكر نفسه بابل)
      geometry:
        type: Point
        coordinates: [ 36.32, 33.55 ]
      sources:
        - { id: ibn-kathir-bidaya, locator: "vol. 1, «قصة إبراهيم خليل الرحمن»" }
    - name:
        en: Ur of the Chaldees, the family's city (Genesis 11:28, 31)
        ar: أور الكلدانيين، مدينة أسرته (التكوين 11:28، 31)
      sources:
        - { id: bible-web, locator: Genesis 11:28-31 }
    - name:
        en: Hebron, his burial place, by continuous tradition (Ibn Kathir)
        ar: حبرون (الخليل)، موضع دفنه، بالتواتر (ابن كثير)
      geometry:
        type: Point
        coordinates: [ 35.11, 31.525 ]
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 1, «وفاة إبراهيم وما قيل في عمره»
