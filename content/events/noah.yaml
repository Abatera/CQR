notes: The span counts back from Noah's death at about 3000 BCE (decided with the owner on 2026-11-25 so that the prophets after Noah keep their dates). The age at his mission (50) is the first of the three views Ibn Kathir lists; the owner may choose another. The outline of al-Jazira is a rough sketch. Other identifications of al-Judi (for example the mountains of Ararat in the Bible) can be added as opinions with sources. Moved by -166 years on 2026-11-26 with Abraham's birth, now about 2166 BCE (D24).
