review: draft
title:
  en: The Black Sea flood hypothesis
  ar: فرضية فيضان البحر الأسود
summary:
  en: In 1997 the geologists Ryan and Pitman proposed that Mediterranean water surged over the Bosphorus sill into a much lower Black Sea lake, drowning its shores, an event since linked to the story of Noah's flood. Later studies found a smaller or more gradual rise.
when:
  from: -7500
  to: -5500
  certainty: debated
  basis:
    en: The proposed date varies between accounts, about 9,400 years ago in Oceanus (2009) and about 7,500 years ago in a 2002 Rensselaer release; the span covers both.
place:
  status: known
  description:
    en: The Black Sea and the Bosphorus strait. The outline is a rough sketch of the sea.
