id: noah
kind: period
lane: prophets
review: draft
title:
  en: Nuh (Noah)
  ar: نوح
summary:
  en: Nuh (Noah), peace be upon him, sent to his people, who rejected him for a thousand years less fifty until the Flood (29:14). The hadith of intercession calls him the first of the messengers to the people of the earth.
when:
  from: -4350
  to: -3000
  certainty: reckoned
  basis:
    en: "Noah's death is placed ten qurun, read as a thousand years, before Abraham (hadith of Abu Umama): about 3000 BCE. Counting back: 350 years after the Flood (Ibn Sa'd; also the Torah), the 950 years among his people that the Quran gives, and the age of fifty at which one report says he was sent. Only the 950 years are fixed; the years before his mission and after the Flood are reported variously."
  core:
    from: -4300
    to: -3351
    basis:
      en: The Quran gives the 950 years he stayed among his people before the Flood took them (29:14).
  alternatives:
    - from: -4650
      to: -3000
      basis:
        en: Sent at the age of 350, a second view reported by Ibn Kathir.
      sources:
        - { id: ibn-kathir-bidaya, locator: "vol. 1, «قصة نوح عليه السلام»" }
    - from: -4780
      to: -3000
      basis:
        en: Sent at the age of 480, from Ibn Abbas through Ibn Jarir, reported by Ibn Kathir.
      sources:
        - { id: ibn-kathir-bidaya, locator: "vol. 1, «قصة نوح عليه السلام»" }
place:
  status: proposed
  description:
    en: The Quran says the Ark came to rest on al-Judi (11:44). Ibn Kathir calls al-Judi a well-known mountain in the land of al-Jazira (Upper Mesopotamia). The area drawn is a rough outline of that region, not an identified peak.
  opinions:
    - name:
        en: al-Judi, a mountain in al-Jazira (Ibn Kathir)
      geometry:
        type: Polygon
        coordinates:
          - - [ 38.8, 36 ]
            - [ 39.8, 37.3 ]
            - [ 42, 37.5 ]
            - [ 43.4, 36.6 ]
            - [ 42.6, 35.4 ]
            - [ 40, 35.2 ]
            - [ 38.8, 36 ]
      sources:
        - { id: ibn-kathir-bidaya, locator: "vol. 1, «قصة نوح عليه السلام»" }
quran: [ "11:25-48", "29:14", "71:1-28" ]
tradition:
  - kind: hadith
    attribution:
      en: The Prophet ﷺ, narrated by Abu Umama al-Bahili
    text:
      en: Between Adam and Noah were ten qurun, and between Noah and Abraham ten qurun. The full report and its gradings are under Adam.
    source:
      id: hakim-mustadrak
      locator: 2/262 and 2/288
    gradings:
      - grade: sahih
        by: al-Hakim
        source:
          id: hakim-mustadrak
          locator: 2/262
        note:
          en: Sound on the condition of Muslim; al-Dhahabi agreed.
      - { grade: sahih, by: al-Albani, source: albani-sahiha }
  - kind: hadith
    attribution:
      en: The Prophet ﷺ, in the hadith of intercession
    text:
      en: On the Day of Resurrection people will come to Noah and say that he was the first of the messengers to the people of the earth.
      ar: أنت أول الرسل إلى أهل الأرض
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «قصة نوح عليه السلام»
    gradings:
      - grade: sahih
        by: al-Bukhari and Muslim
        source:
          id: ibn-kathir-bidaya
          locator: vol. 1, «قصة نوح عليه السلام»
        note:
          en: In both Sahihs, as cited by Ibn Kathir.
  - kind: historian
    attribution:
      en: Ibn Kathir, citing Ibn Jarir al-Tabari and others
    text:
      en: Noah was born 126 years after Adam's death. Reports differ on his age when he was sent, 50, 350 or 480 years, the last from Ibn Abbas through Ibn Jarir.
      ar: بعد وفاة آدم، بمائة سنة وست وعشرين سنة
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «قصة نوح عليه السلام»
  - kind: historian
    attribution:
      en: Ibn Sa'd
    text:
      en: After the Ark, Noah stayed 350 years.
      ar: ثم مكث بعد السفينة ثلاثمائة وخمسين سنة
    source:
      id: ibn-sad-tabaqat
      locator: 1/35
  - kind: historian
    attribution:
      en: Ibn Ishaq and Wahb ibn Munabbih, as quoted by al-Suhari
    text:
      en: Ibn Ishaq said Noah lived 340 years after coming down from the Ark. Wahb said his whole life was a thousand years, because he was sent to his people at fifty.
      ar: وكان عمره ألف سنة لأنه بعث إلى قومه وهو ابن خمسين سنة
    source:
      id: suhari-ansab
      locator: pp. 17, 21
  - kind: historian
    attribution:
      en: Ibn al-Jawzi; Ibn Kathir, quoted by his editor
    text:
      en: Ibn al-Jawzi gives Noah's whole life as 1,450 years. Ibn Kathir says that the Quran requires the thousand years less fifty to be his stay among his people after his mission and before the Flood, "then God knows how long he lived after that".
      ar: ثم الله أعلم كم عاش بعد ذلك؟
    source:
      id: ibn-al-jawzi-amar
      locator: p. 128, with the editor's note 4, which quotes Ibn Kathir
  - kind: ahl-al-kitab
    attribution:
      en: The Torah (Genesis)
    text:
      en: Noah was 600 years old when the Flood came and lived 350 years after it, 950 years in all. The Torah's whole life of 950 years is the same number as the Quran's 950 years among his people.
    source:
      id: bible-web
      locator: Genesis 7:6, 9:28-29
related:
  - { id: the-flood, type: consequence }
  - { id: idris, type: context }
  - { id: hud, type: context }
tags: [ prophets, noah, chronology ]
notes: The span counts back from Noah's death at about 3000 BCE (decided with the owner on 2026-11-25 so that the prophets after Noah keep their dates). The age at his mission (50) is the first of the three views Ibn Kathir lists; the owner may choose another. The outline of al-Jazira is a rough sketch. Other identifications of al-Judi (for example the mountains of Ararat in the Bible) can be added as opinions with sources.
