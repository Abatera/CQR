id: mesopotamian-flood-layers
kind: event
lane: mesopotamia
review: draft
title:
  en: Flood layers at Kish and Shuruppak
  ar: طبقات الفيضان في كيش وشروباك
summary:
  en: Excavations in southern Iraq found thick, water-laid flood deposits at Ur, Kish and Shuruppak. Those at Kish and Shuruppak date to about 3000 BCE; the deposit at Ur is older.
when:
  from: -3100
  to: -2900
  certainty: estimated
  basis:
    en: The flood layers at Kish and Shuruppak lie directly above remains of the Jemdet Nasr period, which Kramer dates to about 3200-3000 BCE; captions in his article date the Shuruppak deposits to about 3000 BCE.
place:
  status: known
  description:
    en: Kish, Shuruppak (Fara) and Ur, in southern Mesopotamia. The outline joins the three sites and is a rough sketch.
  geometry:
    type: Polygon
    coordinates:
      - - [ 44.4, 32.75 ]
        - [ 45.8, 32.2 ]
        - [ 46.4, 30.8 ]
        - [ 45.9, 30.7 ]
        - [ 44.3, 32.4 ]
        - [ 44.4, 32.75 ]
history:
  - claim:
      en: At Ur, from 1929, Woolley found clean, water-laid mud above Ubaid-period remains, in one pit about eleven feet thick, and took it as evidence of the Flood. Kramer notes that the Ur deposits go back to at least 3500 BCE, too early for the flood of the Sumerian texts.
    status: established
    sources: [ kramer-1967 ]
  - claim:
      en: Flood layers at Kish (Langdon and Watelin) and Shuruppak (Schmidt, 1931) lie directly above Jemdet Nasr remains, about 3000 BCE. The deposits at different sites are not all of the same date.
    status: established
    sources: [ kramer-1967 ]
  - claim:
      en: Following Mallowan (1964), Kramer concluded that the flood behind the Mesopotamian tradition was "an actual catastrophic but by no means universal disaster" around 3000 BCE. Linking any of these deposits to the flood of the texts remains an interpretation.
    status: debated
    sources: [ kramer-1967 ]
related:
  - { id: the-flood, type: parallel }
  - { id: sumerian-flood-texts, type: context }
tags: [ flood, mesopotamia, archaeology ]
notes: Kramer's article is a 1967 reprint; look for more recent assessments of the flood deposits and read Mallowan 1964 directly. Verify the site coordinates.
