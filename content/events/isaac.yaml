          locator: vol. 1, «إسحاق بن إبراهيم عليهما الصلاة والتسليم»
quran: [ "11:71", "19:49", "37:112-113" ]
tradition:
  - kind: historian
    attribution:
      en: Ibn Kathir, following the People of the Book
      ar: ابن كثير، نقلًا عن أهل الكتاب
    text:
      en: Isaac was born fourteen years after his brother Ishmael and died aged 180. He lived at Hebron in Canaan, and his sons Esau and Jacob buried him with Abraham in the cave.
      ar: وُلد إسحاق بعد أخيه إسماعيل بأربع عشرة سنة، وتوفّي ابنَ مئةٍ وثمانين سنة. وكان يسكن حبرون في أرض كنعان، ودفنه ابناه العيص ويعقوب مع إبراهيم في المغارة.
    original: بعد أخيه إسماعيل بأربع عشر سنة
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «إسحاق بن إبراهيم عليهما الصلاة والتسليم»
