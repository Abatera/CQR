- id: murad-radd-amin
  type: book
  authors: [ Sharif Murad ]
  title: al-Radd al-Amin
  title_original: الرد الأمين
  url: https://shamela.ws/book/1247/44
  notes: A modern work, read on al-Maktaba al-Shamila (p. 45). It quotes al-Albani and al-Hakim and assesses the chains of the reports on the intervals between the prophets.

