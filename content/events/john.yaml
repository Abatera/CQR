id: john
kind: period
lane: prophets
review: draft
title:
  en: Yahya (John)
  ar: يحيى
summary:
  en: Yahya (John), peace be upon him, son of Zechariah, given wisdom as a child (19:12), who came confirming a word from God (3:39). He was killed by a ruler of his time.
when:
  from: -6
  to: 28
  certainty: estimated
  basis:
    en: A contemporary of Jesus. The Jewish historian Josephus reports that Herod put him to death at the fortress of Machaerus; the exact years are not known.
place:
  status: proposed
  description:
    en: Reports differ on where he was killed. The points are approximate.
  opinions:
    - name:
        en: Bayt al-Maqdis, on the Rock (al-Thawri, from al-A'mash, cited by Ibn Kathir)
      geometry:
        type: Point
        coordinates: [ 35.235, 31.778 ]
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 2, «بيان سبب قتل يحيى عليه السلام»
    - name:
        en: Damascus (Sa'id ibn al-Musayyib; a sound chain to him, says Ibn Kathir)
      geometry:
        type: Point
        coordinates: [ 36.306, 33.511 ]
      sources:
        - id: ibn-kathir-bidaya
          locator: vol. 2, «بيان سبب قتل يحيى عليه السلام»
    - name:
        en: Machaerus, east of the Dead Sea (Josephus)
      geometry:
        type: Point
        coordinates: [ 35.64, 31.56 ]
      sources:
        - { id: josephus-antiquities, locator: 18.5.2 }
quran: [ "3:39", "19:12-15", "21:90" ]
tradition:
  - kind: historian
    attribution:
      en: Ibn Kathir, citing al-Thawri and Sa'id ibn al-Musayyib
    text:
      en: Seventy prophets were killed on the Rock in Bayt al-Maqdis, John among them (al-Thawri, from al-A'mash). A report from Sa'id ibn al-Musayyib, with a sound chain to him, implies he was killed in Damascus.
      ar: وهذا إسناد صحيح إلى سعيد بن المسيب، وهو يقتضي أنه قتل بدمشق
    source:
      id: ibn-kathir-bidaya
      locator: vol. 2, «بيان سبب قتل يحيى عليه السلام»
history:
  - claim:
      en: Josephus writes that Herod, fearing the great influence John "that was called the Baptist" had over the people, sent him as a prisoner to Machaerus, where he was put to death.
    status: established
    sources:
      - { id: josephus-antiquities, locator: 18.5.2 }
related:
  - { id: zechariah, type: context }
  - { id: jesus, type: parallel }
tags: [ prophets, john ]
notes: "TODO: the dates of Herod Antipas and the usual estimate of the year of John's death, with sources. Verify the coordinates."
