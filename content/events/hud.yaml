notes: "The outline of al-Ahqaf is a rough sketch. The generational alternatives are the project's own reckoning (one generation to one qarn), proposed and not yet confirmed by the owner. TODO: Donald Whitcomb's 1992 view that Iram may lie in north-west Arabia was seen only in a search summary, not read; the Christian Science Monitor article on Ubar refused access. Moved by -166 years on 2026-11-26 with Abraham's birth, now about 2166 BCE (D24)."
