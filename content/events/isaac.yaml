review: draft
title:
  en: Ishaq (Isaac)
  ar: إسحاق
summary:
  en: Ishaq (Isaac), peace be upon him, Abraham's son, announced to Abraham and Sarah as glad tidings (11:71), and the father of Jacob.
  ar: إسحاق عليه السلام، ابن إبراهيم، بُشِّر به إبراهيم وسارة (11:71)، وهو أبو يعقوب.
when:
  from: -2066
  to: -1886
  certainty: traditional
  basis:
    en: Born fourteen years after Ishmael, and died aged 180, as Ibn Kathir reports following the People of the Book (Genesis 35:28).
    ar: وُلد بعد إسماعيل بأربع عشرة سنة، وتوفّي ابنَ مئةٍ وثمانين سنة، كما يحكي ابن كثير عن أهل الكتاب (التكوين 35:28).
place:
  status: proposed
  description:
    en: Ibn Kathir says he lived at the village of Hebron in the land of Canaan.
    ar: يذكر ابن كثير أنه سكن قرية حبرون في أرض كنعان.
  opinions:
    - name:
        en: Hebron, in the land of Canaan (Ibn Kathir)
        ar: حبرون (الخليل)، في أرض كنعان (ابن كثير)
      geometry:
        type: Point
        coordinates: [ 35.11, 31.525 ]
      sources:
