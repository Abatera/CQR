history:
  - claim:
      en: Ryan and Pitman proposed that Mediterranean water surged over the Bosphorus sill into a lake at least 80 m lower than today's Black Sea, raising it by 50-60 m and drowning about 70,000 square kilometres.
      ar: اقترح رايان وبيتمان أن مياه البحر المتوسط تدفّقت فوق عتبة البوسفور إلى بحيرةٍ أخفض بثمانين مترًا على الأقل من مستوى البحر الأسود اليوم، فرفعتها خمسين إلى ستين مترًا، وأغرقت نحو سبعين ألف كيلومتر مربع.
    status: debated
    sources: [ lippsett-2009 ]
  - claim:
      en: A 2009 study of a Danube delta core (Giosan and colleagues) found the lake only about 30 m lower and a rise of only 5-10 m; a 2002 study of Marmara Sea sediments (Abrajano and colleagues) described a gradual rise over about 2,000 years.
      ar: وجدت دراسةٌ عام 2009 لعيّنةٍ من دلتا الدانوب (جيوسان وزملاؤه) أن البحيرة كانت أخفض بنحو ثلاثين مترًا فقط، وأن الارتفاع لم يتجاوز خمسة إلى عشرة أمتار؛ ووصفت دراسةٌ عام 2002 لرواسب بحر مرمرة (أبراخانو وزملاؤه) ارتفاعًا تدريجيًّا على مدى نحو ألفي سنة.
    status: debated
    sources: [ lippsett-2009, rpi-2002 ]
