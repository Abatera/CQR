id: abraham-house
kind: event
lane: quran
review: draft
title:
  en: Abraham and Ishmael raise the foundations of the House
  ar: إبراهيم وإسماعيل يرفعان القواعد من البيت
summary:
  en: Abraham, peace be upon him, and his son Ishmael, peace be upon him, raise the foundations of the House in Mecca and pray that it be accepted from them.
when:
  from: -1890
  to: -1826
  certainty: traditional
  basis:
    en: Within Abraham's traditional lifetime, once Ishmael was grown, since the Quran shows them building together. No date is given.
place:
  status: known
  names:
    - { name: Bakka, type: ancient, language: Arabic }
    - { name: Mecca, type: modern }
  description:
    en: The Ka'ba in Mecca. The Quran also calls the place Bakka (3:96).
  geometry:
    type: Point
    coordinates: [ 39.8262, 21.4225 ]
quran: [ "2:125-129", "3:96-97", "22:26" ]
tradition:
  - kind: historian
    attribution:
      en: Ibn Kathir
    text:
      en: No sound report from the infallible Prophet says that the House was built before Abraham. The accounts of Adam or the angels building it come from Israelite sources, which are neither believed nor disbelieved.
      ar: ولم يجئ في خبر صحيح عن معصوم، أن البيت كان مبنيًا قبل الخليل
    source:
      id: ibn-kathir-bidaya
      locator: vol. 1, «بناء البيت العتيق»
related:
  - { id: abraham, type: context }
  - { id: ishmael, type: context }
tags: [ abraham, ishmael, mecca ]
