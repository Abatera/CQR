notes: "Read Ibn Kathir's full discussion of the hadith of Abu Dharr (the forty years) in the chapter on Solomon, to see how he reconciles it with the thousand years; only the 'more than a thousand years' sentence was checked. Verify the coordinates. Anchored at 2166 BCE on 2026-11-26 (D24), within the owner's estimate of 2500–2000 BCE; the episodes are placed by his age from this year. Ibn Kathir's text gives Terah's age at death as 250 (page A, read on Wikisource), Genesis 11:32 as 205: check a printed edition. Not mapped until sourced: Ur of the Chaldees (its identification with the ruins of Ur), and Kutha (Tell Ibrahim?). Barza and Babylon points are approximate. Leads in docs/research/abraham.md: the moon god at Ur and Harran; the Beni Hasan painting; Babylon's earliest mention."
