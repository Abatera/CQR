review: draft
title:
  en: The Third Dynasty of Ur
  ar: سلالة أور الثالثة
summary:
  en: A kingdom ruled from Ur in southern Mesopotamia, about 2100–2000 BCE. A Sumerian lament tells how its king Ibbi-Suen was taken to Elam in fetters and Ur was left a ruin.
  ar: مملكةٌ حُكمت من أور في جنوب بلاد الرافدين، نحو 2100–2000 ق.م. وتروي مرثيةٌ سومرية كيف حُمل ملكها إبّي-سين إلى عيلام مكبّلًا، وتُركت أور خرابًا.
when:
  from: -2100
  to: -2000
  certainty: estimated
  basis:
    en: The Cuneiform Digital Library Initiative dates the Ur III period to about 2100–2000 BCE.
    ar: تؤرّخ مبادرة المكتبة المسمارية الرقمية حقبةَ أور الثالثة بنحو 2100–2000 ق.م.
place:
  status: known
  names:
