tags: [ prophets, adam, chronology ]
notes: "Ages decided with the owner on 2026-11-25: the chronology before Abraham is counted back from Noah's death through the reported ages; Adam's 960 years follow the owner's reading of al-Tirmidhi's version, with 1,000 and 930 as alternatives. The chain hadith in al-Mustadrak (Ibn Abbas via Yusuf ibn Mihran and Ali ibn Zayd) is probably the report of the intervals between the prophets that the owner asked about: confirm with the owner and check its full text in an edition. The gradings of the Abu Umama hadith by al-Hakim and al-Albani were read in secondary sources (islamqa.info 20907, islamweb.net 203734); check them in the books. Moved by -166 years on 2026-11-26 with Abraham's birth, now about 2166 BCE (D24)."
