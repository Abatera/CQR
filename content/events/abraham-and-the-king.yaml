tags: [ prophets, abraham, nimrod ]
notes: "Leads (docs/research/abraham.md), to verify before adding: Babylon's earliest mention (a year-name of Shar-kali-sharri, about 2200 BCE) and its rise as a capital (about 1894 BCE); the proposal that the biblical Nimrod reflects the kings of Akkad (Y. Levin, Vetus Testamentum 52, 2002)."
