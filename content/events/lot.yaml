    attribution:
      en: Ibn Kathir
      ar: ابن كثير
    text:
      en: Abraham took with him his nephew, Lut son of Haran son of Azar. Lut settled in the city of Sodom.
      ar: أخذ إبراهيم معه ابنَ أخيه لوطَ بن هاران بن آزر، ونزل لوطٌ مدينةَ سدوم.
    original: ابن أخيه لوط بن هاران بن آزر
    source:
