  title: "1177 B.C.: The Year Civilization Collapsed"
  edition: Revised and updated
  year: 2021
  publisher: Princeton University Press
  place: Princeton

- id: ibn-kathir-bidaya
  type: book
  authors: [ Ibn Kathir ]
  title: al-Bidaya wa-l-Nihaya
  title_original: البداية والنهاية
  url: https://ar.wikisource.org/wiki/البداية_والنهاية
  notes: Read in the Arabic Wikisource transcription, chapter by chapter; locators give the volume and the chapter title. Ibn Kathir died in 774 AH / 1373 CE. Page numbers of a printed edition are still to be added.

- id: ibn-asakir-dimashq
  type: book
  authors: [ Ibn 'Asakir ]
  title: Tarikh Madinat Dimashq
  title_original: تاريخ مدينة دمشق
  url: https://shamela.ws/book/71
  notes: Read on al-Maktaba al-Shamila. Vol. 1, p. 32 quotes Ibn Sa'd's al-Tabaqat al-Kubra (1/53, according to the editor's note).

- id: ibn-sad-tabaqat
  type: book
  authors: [ Ibn Sa'd ]
  title: al-Tabaqat al-Kubra
  title_original: الطبقات الكبرى
  publisher: Dar al-Kutub al-'Ilmiyya
  url: https://shamela.ws/book/1686
  notes: The intervals at 1/53 were read as quoted by Ibn 'Asakir (Tarikh Dimashq 1/32), not in the Tabaqat itself; check them there.

